name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly scan — catches newly disclosed CVEs even when code doesn't change
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── CodeQL — static analysis for Python & TypeScript ─────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF results to Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # Use the security-and-quality query suite for deeper analysis
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"

  # ── Dependency vulnerability audit ───────────────────────────────────────
  audit-backend:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      # Export production deps (no dev tools) to a requirements file with hashes,
      # then run pip-audit via uvx (ephemeral venv — no need to add it to pyproject.toml).
      # --require-hashes ensures the audit is against the pinned, hash-verified packages.
      - name: Export production requirements
        run: uv export --format requirements-txt --frozen --no-dev --no-emit-project -o /tmp/requirements-prod.txt

      - name: pip-audit
        run: uvx pip-audit --require-hashes -r /tmp/requirements-prod.txt

  audit-frontend:
    name: Dependency Audit (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm audit exits non-zero on high/critical — blocks merging vulnerable deps
      - name: pnpm audit
        run: pnpm audit --audit-level=high
