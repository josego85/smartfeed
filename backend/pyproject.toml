[project]
name = "smartfeed-backend"
version = "0.0.3"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.6",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "feedparser==6.0.14",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "pgvector==0.5.1",
    "litellm==1.109.1",
    "typer==0.29.1",
    "numpy==2.5.4",
    "arq==0.28.0",
]

[project.scripts]
smartfeed = "app.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "respx==0.23.1",
    "httpx==0.28.1",
    "ruff==0.17.5",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/cli/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "unit: fast tests with no external I/O",
    "integration: tests that wire up the full API layer",
    "e2e: end-to-end tests that require a real database — run docker-compose.test.yml first",
]
